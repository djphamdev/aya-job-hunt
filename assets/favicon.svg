<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Main blue glassy gradient -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="1"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="75%" stop-color="#0284c7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="1"/>
    </linearGradient>
    <!-- Highlight gradient (top-left glass reflection) -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Inner glow -->
    <radialGradient id="glow" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0c4a6e" flood-opacity="0.5"/>
    </filter>
    <!-- For the 3D extrude effect -->
    <filter id="bevel">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant="0.8" specularExponent="20" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="135" elevation="60"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>
  
  <!-- Tilted star: rotated 15deg with bevel+glass effect -->
  <g transform="rotate(-15 32 32)" filter="url(#shadow)">
    <!-- Back layer (darker, offset for 3D depth) -->
    <polygon points="32,4 39,24 60,24 43,36 49,56 32,44 15,56 21,36 4,24 25,24" 
             fill="#0369a1" opacity="0.7" transform="translate(1.5, 1.5)"/>
    
    <!-- Main star body with glass gradient -->
    <polygon points="32,4 39,24 60,24 43,36 49,56 32,44 15,56 21,36 4,24 25,24" 
             fill="url(#glass)" filter="url(#bevel)"/>
    
    <!-- Inner glow -->
    <polygon points="32,4 39,24 60,24 43,36 49,56 32,44 15,56 21,36 4,24 25,24" 
             fill="url(#glow)"/>
    
    <!-- Glass highlight (top-left portion) -->
    <polygon points="32,4 39,24 60,24 43,36 32,32 25,24 20,20 28,12" 
             fill="url(#highlight)" opacity="0.6"/>
    
    <!-- Edge highlight stroke -->
    <polygon points="32,4 39,24 60,24 43,36 49,56 32,44 15,56 21,36 4,24 25,24" 
             fill="none" stroke="#bae6fd" stroke-width="0.5" opacity="0.7"/>
    
    <!-- Small sparkle -->
    <circle cx="24" cy="16" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="22" cy="14" r="0.8" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
